name: ShutdownTimer
options:
  bundleIdPrefix: com.zeeshan
targets:
  ShutdownTimer:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ShutdownTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeeshan.ShutdownTimer
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5"
    info:
      path: ShutdownTimer/Info.plist
      properties:
        LSUIElement: true
        NSAppleEventsUsageDescription: "Shutdown Timer needs permission to control System Events in order to shut down your Mac."
  ShutdownTimerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ShutdownTimerTests
    settings:
      base:
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        SWIFT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ShutdownTimer
schemes:
  ShutdownTimer:
    build:
      targets:
        ShutdownTimer: all
        ShutdownTimerTests: [test]
    test:
      targets:
        - ShutdownTimerTests
